<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Employee Management System</h1>

        <!-- Employee Form -->
        <div class="form-container">
            <h2 id="formTitle">Add New Employee</h2>

            <form id="employeeForm">

                <input type="hidden" id="editIndex">

                <div class="form-group">
                    <label for="empId">Employee ID</label>
                    <input type="text" id="empId"
                           placeholder="Enter Employee ID" required>
                </div>

                <div class="form-group">
                    <label for="empName">Employee Name</label>
                    <input type="text" id="empName"
                           placeholder="Enter Employee Name" required>
                </div>

                <div class="form-group">
                    <label for="empEmail">Email</label>
                    <input type="email" id="empEmail"
                           placeholder="Enter Email" required>
                </div>

                <div class="form-group">
                    <label for="empDepartment">Department</label>
                    <select id="empDepartment" required>
                        <option value="">Select Department</option>
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="Finance">Finance</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Sales">Sales</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="empSalary">Salary</label>
                    <input type="number" id="empSalary"
                           placeholder="Enter Salary"
                           min="1" step="0.01" required>
                </div>

                <button type="submit" id="submitBtn">
                    Add Employee
                </button>

                <button type="button" id="cancelBtn" hidden>
                    Cancel Edit
                </button>

            </form>
        </div>

        <!-- Search and Filter -->
        <div class="controls">

            <input type="text" id="searchInput"
                   placeholder="Search by ID or name...">

            <select id="departmentFilter">
                <option value="">All Departments</option>
                <option value="IT">IT</option>
                <option value="HR">HR</option>
                <option value="Finance">Finance</option>
                <option value="Marketing">Marketing</option>
                <option value="Sales">Sales</option>
            </select>

        </div>

        <!-- Employee List -->
        <div class="table-container">

            <h2>Employee Records</h2>

            <p id="employeeCount">Total Employees: 0</p>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="employeeTableBody">
                    <!-- JavaScript adds employee records here -->
                </tbody>
            </table>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
